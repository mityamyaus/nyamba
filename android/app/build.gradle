plugins { id 'com.android.application' }
android {
 namespace 'ru.nyamba.app'
 compileSdk 35
 defaultConfig { applicationId 'ru.nyamba.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
 sourceSets { main { assets.srcDirs = ["$buildDir/generated/nyambaAssets"] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyWebAssets', Copy) { from('../../dist'); into("$buildDir/generated/nyambaAssets"); exclude 'sw.js' }
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
